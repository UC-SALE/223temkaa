<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Big Bold Text</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            width: 100%;
            padding: 20px;
            text-align: center;
        }
        .big-bold-text {
            font-size: 10vw; 
            font-weight: 900;
            line-height: 1.1;
            color: #000000;
            
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="big-bold-text">223 temuulen [cargo baraa burtgel]</h1>
         <h1 class="big-bold-text">223 erkhbilguun [duu hudaldaj awah]</h1>
        <h1 class="big-bold-text">223 tuguldur [kino tasalbar ]</h1>
    </div>

</body>
</html>
